<svg viewBox="0 0 1120 410" xmlns="http://www.w3.org/2000/svg" style="width:80%;height:auto;" role="img" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <!-- human responsibility zone -->
  <rect x="24" y="56" width="650" height="330" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="349" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309" letter-spacing="1">HUMAN RESPONSIBILITY</text>

  <!-- human intent card -->
  <rect x="48" y="112" width="216" height="210" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="156" y="144" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Human intent</text>
  <line x1="66" y1="160" x2="246" y2="160" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="156" y="196" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0f172a">Fermat's Last Theorem</text>
  <g font-size="13.5" fill="#475569" text-anchor="middle">
    <text x="156" y="226">“No solution in positive</text>
    <text x="156" y="246">integers to a<tspan font-size="9.5" baseline-shift="super">n</tspan> + b<tspan font-size="9.5" baseline-shift="super">n</tspan> = c<tspan font-size="9.5" baseline-shift="super">n</tspan></text>
    <text x="156" y="266">for n &gt; 2.”</text>
  </g>

  <!-- AI arrow -->
  <text x="309" y="196" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">AI</text>
  <line x1="272" y1="217" x2="328" y2="217" stroke="#b45309" stroke-width="3"/>
  <polygon points="328,210 346,217 328,224" fill="#b45309"/>

  <!-- formal statement card -->
  <rect x="354" y="112" width="296" height="210" rx="10" fill="#fff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="502" y="144" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">Formal statement</text>
  <line x1="374" y1="160" x2="630" y2="160" stroke="#e0f2fe" stroke-width="1.5"/>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#334155">
    <text x="372" y="198"><tspan fill="#0e7490" font-weight="600">theorem</tspan> fermat_last_theorem :</text>
    <text x="372" y="224">    n &gt; 2 → a &gt; 0 → b &gt; 0 → c &gt; 0 →</text>
    <text x="372" y="250">    a^n + b^n ≠ c^n := <tspan fill="#0e7490" font-weight="600">by</tspan></text>
    <text x="372" y="278">  … Proof …</text>
  </g>

  <!-- human responsibility captions -->
  <text x="349" y="350" text-anchor="middle" font-size="14.5" font-style="italic" fill="#92400e">The formal statement must reflect your intent.</text>
  <text x="349" y="372" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">Lean cannot check whether AI autoformalized the statement correctly.</text>

  <!-- Lean guarantee zone -->
  <rect x="744" y="56" width="352" height="330" rx="14" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="920" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#0073A3" letter-spacing="1">LEAN'S GUARANTEE</text>

  <!-- check arrow (drawn after the zone so the head is not covered) -->
  <text x="707" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#0073A3" letter-spacing="1.5">CHECK</text>
  <line x1="658" y1="217" x2="744" y2="217" stroke="#0073A3" stroke-width="3.5"/>
  <polygon points="744,209 762,217 744,225" fill="#0073A3"/>

  <!-- checked proof card -->
  <rect x="768" y="112" width="304" height="210" rx="10" fill="#0073A3"/>
  <circle cx="920" cy="172" r="27" fill="#fff"/>
  <path d="M907 172 L917 183 L935 159" fill="none" stroke="#0073A3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="920" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Checked proof</text>
  <text x="920" y="268" text-anchor="middle" font-size="13.5" fill="#cfe8f5">Verified by the Lean kernel.</text>

  <!-- Lean guarantee captions -->
  <text x="920" y="350" text-anchor="middle" font-size="14.5" font-style="italic" fill="#0c4a6e">The proof proves exactly that statement.</text>
  <text x="920" y="372" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0073A3">Lean guarantees this.</text>
</svg>
