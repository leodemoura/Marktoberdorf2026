<svg viewBox="0 0 1120 250" xmlns="http://www.w3.org/2000/svg" style="width:80%;height:auto;" role="img" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <!-- inputs -->
  <rect x="40" y="42" width="170" height="56" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="125" y="76" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0f172a">Code</text>
  <rect x="40" y="152" width="170" height="56" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="125" y="186" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0f172a">Specification</text>

  <!-- converging arrows into the VC generator -->
  <g stroke="#0891b2" stroke-width="2.5" fill="none">
    <path d="M210 70 C 248 70 248 108 262 108"/>
    <path d="M210 180 C 248 180 248 142 262 142"/>
  </g>
  <g fill="#0891b2">
    <polygon points="262,101 280,108 262,115"/>
    <polygon points="262,135 280,142 262,149"/>
  </g>

  <!-- VC generator -->
  <rect x="284" y="87" width="190" height="76" rx="10" fill="#fff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="379" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">VC generator</text>
  <text x="379" y="142" text-anchor="middle" font-size="12.5" fill="#0369a1">Aeneas · Velvet · vcgen</text>
  <text x="379" y="192" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#b45309">bottleneck 1: superlinear</text>

  <!-- arrow to obligations -->
  <line x1="474" y1="125" x2="516" y2="125" stroke="#0891b2" stroke-width="3"/>
  <polygon points="516,118 534,125 516,132" fill="#0891b2"/>

  <!-- proof obligations (stacked) -->
  <rect x="556" y="103" width="180" height="76" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
  <rect x="548" y="95" width="180" height="76" rx="10" fill="#eff6ff" stroke="#cbd5e1"/>
  <rect x="540" y="87" width="180" height="76" rx="10" fill="#fff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="630" y="118" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0c4a6e">Proof obligations</text>
  <text x="630" y="142" text-anchor="middle" font-size="12.5" fill="#0369a1">share many hypotheses</text>

  <!-- discharge arrow -->
  <text x="771" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#0e7490">discharge</text>
  <line x1="744" y1="125" x2="778" y2="125" stroke="#0891b2" stroke-width="3"/>
  <polygon points="778,118 796,125 778,132" fill="#0891b2"/>

  <!-- tactics -->
  <rect x="800" y="87" width="130" height="76" rx="10" fill="#fff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="865" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">Tactics</text>
  <text x="865" y="142" text-anchor="middle" font-size="12.5" fill="#0369a1">simp · grind · …</text>
  <text x="865" y="192" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#b45309">bottleneck 2: repeated work</text>
  <text x="865" y="212" text-anchor="middle" font-size="11.5" font-style="italic" fill="#92400e">naive: shared hypotheses reprocessed per obligation</text>

  <!-- proofs arrow -->
  <text x="957" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0e7490">proofs</text>
  <line x1="936" y1="125" x2="964" y2="125" stroke="#0891b2" stroke-width="3"/>
  <polygon points="964,118 982,125 964,132" fill="#0891b2"/>

  <!-- kernel -->
  <rect x="986" y="87" width="110" height="76" rx="10" fill="#0073A3"/>
  <text x="1041" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Kernel</text>
  <text x="1041" y="142" text-anchor="middle" font-size="12" fill="#cfe8f5">checks</text>
</svg>
